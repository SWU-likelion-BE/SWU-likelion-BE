name: CI

# develop/main 대상 PR에서 테스트와 Docker 빌드만 검증한다. (이미지 push·배포 없음)
# deploy.yml에서도 배포 전 단계로 재사용한다. (workflow_call)
on:
  pull_request:
    branches: [develop, main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 통합 테스트(@SpringBootTest)용 PostgreSQL. 운영 DB와 무관한 일회용 컨테이너다.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: afterme_test
          POSTGRES_USER: afterme
          POSTGRES_PASSWORD: afterme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afterme -d afterme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/afterme_test
      SPRING_DATASOURCE_USERNAME: afterme
      SPRING_DATASOURCE_PASSWORD: afterme_test
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_OPEN_IN_VIEW: "false"
      JWT_SECRET: ci-only-test-secret-key-at-least-32-bytes-long

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  docker-build:
    name: Docker build & smoke test (prod profile)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # 운영과 같은 prod 프로파일로 이미지를 띄워 보기 위한 PostgreSQL
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: afterme
          POSTGRES_USER: afterme
          POSTGRES_PASSWORD: afterme_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afterme -d afterme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # push 하지 않고 러너의 로컬 Docker에만 이미지를 올린다.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: afterme-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CORS_ALLOWED_ORIGINS를 빈 값으로 두어 운영 초기 설정 그대로 기동되는지 확인한다.
      - name: Run container with prod profile
        run: |
          docker run -d --name afterme-smoke --network host \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e DB_URL=jdbc:postgresql://localhost:5432/afterme \
            -e DB_USERNAME=afterme \
            -e DB_PASSWORD=afterme_smoke \
            -e JWT_SECRET=ci-only-smoke-secret-key-at-least-32-bytes \
            -e CORS_ALLOWED_ORIGINS= \
            afterme-backend:ci

      - name: Wait for health UP
        run: |
          for i in $(seq 1 36); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App is UP (${i}회 시도)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' afterme-smoke)" != "true" ]; then
              echo "::error::컨테이너가 종료되었습니다."
              break
            fi
            sleep 5
          done
          docker logs --tail=200 afterme-smoke
          exit 1

      # prod에서 Swagger는 비공개, Actuator는 health 외 비공개인지 확인
      - name: Verify prod exposure
        run: |
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")
            echo "$1 → $code"
            [ "$code" != "200" ] || { echo "::error::$1 이 prod에서 공개되어 있습니다."; exit 1; }
          }
          check /v3/api-docs
          check /swagger-ui/index.html
          check /actuator/env
          check /actuator/info

      - name: Container logs
        if: always()
        run: docker logs --tail=100 afterme-smoke || true
