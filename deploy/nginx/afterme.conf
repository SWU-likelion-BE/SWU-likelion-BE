# AfterMe API 리버스 프록시 (HTTP)
#
# 설치 위치 (EC2):
#   nginx.org 패키지(1.28)  → /etc/nginx/conf.d/afterme.conf  (기존 conf.d/default.conf는 비활성화)
#   Ubuntu 기본 패키지       → /etc/nginx/sites-available/afterme + sites-enabled 링크
#
# 도메인이 생기면 server_name을 바꾸고 certbot으로 443(HTTPS)을 추가한다.

upstream afterme_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 첨부파일 업로드 한도(spring.servlet.multipart.max-request-size=11MB)와 맞춘다.
    client_max_body_size 11m;

    # 응답 헤더에 Nginx 버전 숨김
    server_tokens off;

    location / {
        proxy_pass http://afterme_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # actuator는 health만 외부에 공개한다. (앱에서도 health만 노출)
    location = /actuator/health {
        proxy_pass http://afterme_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location /actuator/ {
        return 404;
    }
}
