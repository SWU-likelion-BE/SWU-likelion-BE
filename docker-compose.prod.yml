# 운영(EC2) 배포용 compose. 로컬 개발용 DB는 compose.yaml을 사용한다.
#
# EC2 ~/app 폴더에서 .env와 함께 실행한다.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# APP_IMAGE는 GitHub Actions가 배포할 때 커밋 SHA 태그로 지정한다.
# 직접 실행할 때 생략하면 latest 태그를 사용한다.
name: afterme

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    # 1GB 서버에 맞춘 메모리 설정 (기본값보다 작게)
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=192MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports를 열지 않는다: app 컨테이너만 내부 네트워크로 접근한다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    image: ${APP_IMAGE:-ghcr.io/swu-likelion-be/afterme-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # JVM 옵션은 Dockerfile의 JAVA_OPTS 기본값을 사용한다.
      # 바꿔야 할 때만 아래 줄을 추가한다. (빈 값으로 두면 기본값이 사라지므로 주의)
      # JAVA_OPTS: "-Xms192m -Xmx384m ..."
    # 호스트의 Nginx만 접근하도록 루프백에만 바인딩한다.
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
