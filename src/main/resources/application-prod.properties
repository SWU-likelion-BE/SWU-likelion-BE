# 운영(prod) 프로파일. 값은 모두 환경변수로 주입한다. (docker-compose.prod.yml + EC2 ~/app/.env)

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# t3.micro(1GB) 환경이라 커넥션 수를 작게 유지한다.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# 스키마는 Flyway로만 변경하고, JPA는 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# CORS: 쉼표로 구분한 허용 Origin 목록. 비어 있으면 브라우저 교차 출처 요청을 허용하지 않는다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Swagger(OpenAPI) 비공개
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Actuator는 health만 공개하고 상세 정보는 숨긴다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Nginx 리버스 프록시 뒤에서 X-Forwarded-* 헤더 반영
server.forward-headers-strategy=framework
server.shutdown=graceful
