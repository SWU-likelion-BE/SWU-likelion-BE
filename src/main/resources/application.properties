spring.application.name=afterme-backend

# JWT
jwt.secret=${JWT_SECRET}
jwt.issuer=afterme
jwt.access-token-ttl=30m
jwt.refresh-token-ttl=14d

# 로그인 실패 잠금 정책 (잠금 시간은 회의 후 확정)
auth.login.max-failed-attempts=5
auth.login.lock-duration=30m

# Task attachment uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# AI (OpenAI)
ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.base-url=https://api.openai.com/v1
ai.openai.model=gpt-4o-mini
ai.openai.timeout=60s

# AI 작업 워커 (기본 꺼짐: 테스트 중 작업이 자동 처리되지 않게 함)
ai.worker.enabled=false
ai.worker.poll-delay-ms=5000
ai.worker.batch-size=5
ai.worker.max-attempts=3
ai.worker.stale-after=10m
